<title>APCB 2027 Backdrop (Mobile)</title>
<style>
/* Mobile build: all soft lighting is painted into ONE low-res canvas (#bg) and all crisp effects into
   ONE canvas (#fx). Only the title, seals and borders are separate elements, so phones composite
   a handful of layers instead of ~25 blended full-screen ones. */
:root { --bg-deep: #020a1c; --label: #cfdcf5; --hi: 150, 210, 255; --lo: 80, 150, 255; --vig: 0, 0, 0; }
:root[data-theme="summer"] { --bg-deep: #1a0f3d; --label: #ffe6cc; --hi: 255, 226, 170; --lo: 255, 130, 80; --vig: 30, 5, 40; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-deep);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
/* shown instantly while the page loads, so the screen is never a blank black */
body { background: radial-gradient(ellipse 80% 60% at 50% 40%, #0b2353, #020a1c 80%); }
:root[data-theme="summer"] body { background: linear-gradient(to bottom, #1a0f3d 0%, #3b1752 30%, #852c5e 56%, #d65a43 78%, #f39a43 92%, #f7b04a 100%); }
body.idle, body.idle * { cursor: none !important; }
#view { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden;
  font-family: 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif; opacity: 0; transition: opacity 1.2s ease; }
#stage.ready { opacity: 1; }
canvas.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
.abs { position: absolute; left: 0; top: 0; }
#lockup, #glint { will-change: transform, opacity; }
#lockup { opacity: 0; }
#glint { pointer-events: none; opacity: 0;
  background: linear-gradient(105deg, transparent 42%, rgba(255,240,210,.30) 47%, rgba(255,255,255,.75) 50%, rgba(255,240,210,.30) 53%, transparent 58%);
  background-size: 300% 100%; background-repeat: no-repeat;
  -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
.border { left: -300px; height: 70px; background-repeat: repeat-x; will-change: transform; }
#seals { left: 0; display: flex; justify-content: center; align-items: flex-end; gap: 120px; will-change: transform, opacity; opacity: 0; }
.sealGroup { text-align: center; }
.sealGroup .lab { color: var(--label); opacity: 0.6; font-size: 13px; letter-spacing: 0.42em; text-transform: uppercase; margin-bottom: 14px; }
.sealGroup .row { display: flex; gap: 46px; justify-content: center; }
.sealGroup img { height: 88px; }
#stage.portrait .sealGroup .lab { font-size: 19px; margin-bottom: 18px; }
#stage.portrait .sealGroup .row { gap: 40px; }
#stage.portrait .sealGroup img { height: 124px; }
[data-theme="summer"] .sealGroup .lab { opacity: 0.85; text-shadow: 0 1px 8px rgba(70, 10, 50, 0.7); }

<script>
/* ===== ENGINE — every motion uses integer harmonics of one loop phase, so the loop is seamless. ===== */
(() => {
  const TAU = Math.PI * 2, $ = id => document.getElementById(id);
  const E = Math.max(0, CONFIG.energy);
  const SUMMER = CONFIG.theme === 'summer';
  const root = document.documentElement;
  root.dataset.theme = SUMMER ? 'summer' : 'night';
  const stage = $('stage'), view = $('view');

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const smooth = x => x * x * (3 - 2 * x);
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeBack = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const frac = x => x - Math.floor(x);

  // ---------- palette ----------
  const PAL = SUMMER ? {
    blooms: ['#ff8a3d', '#ff5d8f', '#2ec4b6'], particle: '255,214,150', hi: '255,226,170', lo: '255,130,80', vig: '30,5,40',
    sky: (g, W, H, sun) => {
      const lin = g.createLinearGradient(0, 0, 0, H);
      [[0, '#1a0f3d'], [.30, '#3b1752'], [.56, '#852c5e'], [.78, '#d65a43'], [.92, '#f39a43'], [1, '#f7b04a']].forEach(s => lin.addColorStop(...s));
      g.fillStyle = lin; g.fillRect(0, 0, W, H);
      g.save(); g.translate(sun[0], sun[1]); g.scale(1, 460 / 900);
      const r = g.createRadialGradient(0, 0, 0, 0, 0, 900);
      r.addColorStop(0, 'rgba(255,214,120,.9)'); r.addColorStop(.3, 'rgba(255,140,70,.5)'); r.addColorStop(.7, 'rgba(255,140,70,0)');
      g.fillStyle = r; g.fillRect(-900, -900, 1800, 1800); g.restore();
    },
  } : {
    blooms: ['#1f5fd0', '#2bb3e6', '#c4162a'], particle: '120,185,245', hi: '150,210,255', lo: '80,150,255', vig: '0,0,0',
    sky: (g, W, H) => {

      const ringA = 0.42 * E * (1 - wave), introA = intro < 1 ? 0.6 * (1 - intro) : 0;
      for (const c of cells) {
        if (c.m < 0.02) continue;
        let a = 0, k;
        if (ringA > 0.02 && (k = Math.abs(c.d - R)) < 200) a += ringA * Math.exp(-(k * k) / 8100);
        if ((k = Math.abs(c.s - diag)) < 320) a += 0.16 * E * Math.exp(-(k * k) / 19600);
        if (introA && (k = Math.abs(c.d - R2)) < 260) a += introA * Math.exp(-(k * k) / 14400);
        a *= c.m;
        if (a < 0.02) continue;
        hexTo(buckets[Math.min(NB - 1, Math.floor(Math.sqrt(a / 0.6) * NB))], c.x, c.y, HR - 3);
      }
      fx.lineWidth = 1.4;
      buckets.forEach((p, i) => { const a = 0.6 * Math.pow((i + 0.6) / NB, 2); fx.strokeStyle = hexA(pc, a); fx.stroke(p);
        if (a > 0.18) { fx.fillStyle = hexA(pc, (a - 0.18) * 0.35); fx.fill(p); } });
    }
    if (SUMMER && CONFIG.seaGlitter) {
      fx.fillStyle = hexA(hi, 1);
      for (const g of GLIT) {
        const a = Math.pow(Math.max(0, Math.sin(g.f * th + g.ph)), 6) * intro;
        if (a < 0.03) continue;
        fx.globalAlpha = a * 0.95;
        fx.fillRect(g.x + 10 * Math.sin(3 * th + g.ph) - g.len / 2, g.y, g.len, 2);
      }
      fx.globalAlpha = 1;
    }

    // particles (with depth parallax, glow and constellation links)
    const pts = [];
    fx.fillStyle = hexA(pc, 1);
    for (const p of P) {
      const a = p.dir * p.k * th + p.ph, par = 0.3 + p.z * 1.4;
      let x = p.x + p.r * Math.cos(a) + Math.sin(2 * th + p.ph) * 90 - camX * 40 * par;
      let y = (((p.y + p.r * Math.sin(a) * .85 + Math.sin(th * (p.tw + 2) + p.ph) * 80 - p.rise * t * H - camY * 20 * par) % H) + H) % H;
      const dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const push = 26 * E * Math.exp(-Math.pow((d - easeOut(wave) * 1500 * reach) / 160, 2)) * (1 - wave);
      x += dx / d * push; y += dy / d * push;
      if (intro < 1) { const ib = (1 - easeOut(intro)) * 420; x += dx / d * -ib * (1 - p.z * .5); y += dy / d * -ib * (1 - p.z * .5); }
      const edge = clamp(Math.min(y / 150, (H - y) / 150));
      const alpha = clamp(p.a * edge * (0.7 + 0.4 * Math.sin(p.tw * th + p.ph + 2)) * (0.6 + 0.4 * intro) + push / 120);
      pts.push({ x, y, alpha, z: p.z });
      if (p.glow) { const gs = p.s * 7; fx.globalAlpha = alpha * 0.9; fx.drawImage(SPR.dot, x - gs, y - gs, gs * 2, gs * 2); }
      fx.globalAlpha = alpha;
      fx.beginPath(); hexTo(fx, x, y, p.s * (0.88 + 0.32 * Math.sin(2 * th + p.ph))); fx.fill();
    }
    fx.globalAlpha = 1;
    if (CONFIG.constellation && Qv.links) {
      const NB = 5, buckets = Array.from({ length: NB }, () => new Path2D());
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const A = pts[i], B = pts[j]; if (Math.abs(A.z - B.z) > .35) continue;
        const dx = A.x - B.x, dy = A.y - B.y, dd = dx * dx + dy * dy; if (dd > 180 * 180) continue;
        const la = (1 - Math.sqrt(dd) / 180) * Math.min(A.alpha, B.alpha) * 0.9;
        if (la < 0.015) continue;
        const p = buckets[Math.min(NB - 1, Math.floor(la / 0.3 * NB))]; p.moveTo(A.x, A.y); p.lineTo(B.x, B.y);
      }
      fx.lineWidth = 1.2;
      buckets.forEach((p, i) => { fx.strokeStyle = hexA(pc, 0.3 * (i + 0.5) / NB); fx.stroke(p); });
    }

    // hexagonal shockwave rings (soft halo = wide faint stroke; no shadowBlur)
    const ring = (p, maxR, alpha, rot, width) => {
      if (alpha < 0.005) return;
      const r = 220 + easeOut(p) * maxR * reach, w = width * (1 - p * .6);
      fx.beginPath(); hexTo(fx, cx, cy, r, rot);
      fx.lineWidth = w * 7; fx.strokeStyle = hexA(lo, alpha * .22); fx.stroke();
      fx.lineWidth = w; fx.strokeStyle = hexA(hi, alpha); fx.stroke();
      fx.strokeStyle = hexA(lo, alpha * .45);
      fx.beginPath(); fx.ellipse(cx, cy, r * 1.08, r * 0.92, 0, 0, TAU); fx.stroke();
    };
    if (CONFIG.shockwaves) {
      ring(wave, 1300, 0.38 * E * Math.pow(1 - wave, 2), th * 2, 3);
      ring(clamp(wave * 1.25 - .1), 1100, 0.2 * E * Math.pow(1 - clamp(wave * 1.25 - .1), 2), -th * 2 + .5, 2);
    }
    if (intro < 1) ring(intro, 1700, 0.9 * Math.pow(1 - intro, 1.5), 0, 5);

    if (SUMMER && CONFIG.sunFlare) {
      const tx = X(700 + 380 * Math.sin(th)), ty = Y(160 + 70 * Math.cos(2 * th));
      for (const f of FLARES) {
        fx.fillStyle = hexA(f.c, f.a * E * intro * (0.7 + 0.3 * Math.sin(2 * th + f.k * 4)));
        fx.beginPath(); hexTo(fx, SUN_X + (tx - SUN_X) * f.k, sunY + (ty - sunY) * f.k, f.r, th); fx.fill();
      }
    }
    for (const k of STREAKS) {
      const sp = (frac(t - k.at + 1)) * CONFIG.loopSeconds / 1.4;  // 1.4 s life
      if (sp >= 1) continue;
      const e = easeOut(sp), dir = Math.sign(k.ang) || 1;
      const hx = k.x + Math.cos(k.ang) * k.dist * e * dir, hy = k.y + Math.sin(Math.abs(k.ang)) * k.dist * e;
      const tx = hx - Math.cos(k.ang) * k.len * dir * (1 - sp * .5), ty = hy - Math.sin(Math.abs(k.ang)) * k.len * (1 - sp * .5);
      const al = Math.sin(Math.PI * sp) * 0.8 * E;
      const g = fx.createLinearGradient(tx, ty, hx, hy);
      g.addColorStop(0, hexA(lo, 0)); g.addColorStop(1, hexA(hi, al));
      fx.strokeStyle = g; fx.lineWidth = 2.6; fx.lineCap = 'round';
      fx.beginPath(); fx.moveTo(tx, ty); fx.lineTo(hx, hy); fx.stroke();
      fx.globalAlpha = al; fx.drawImage(SPR.dot, hx - 22, hy - 22, 44, 44); fx.globalAlpha = 1;
    }
    if (intro < 1) {   // intro flash
      const fl = 0.55 * Math.pow(Math.sin(Math.PI * clamp(intro * 2.2)), 3);
      if (fl > 0.005) { fx.globalAlpha = fl; put(fx, SPR.glow, cx, cy, W * 2.2, H * 1.6); put(fx, SPR.dot, cx, cy, W * 1.4, W * 1.4); fx.globalAlpha = 1; }
    }
    fx.globalCompositeOperation = 'source-over';

    // ================= DOM: title, glint, seals, borders (compositor-only transforms) =================
    const lkW = L.lockW, lkH = lockup.naturalWidth ? lkW * lockup.naturalHeight / lockup.naturalWidth : lkW * .53;
    const lkTop = L.lockCY - lkH * 0.59;
    const iS = intro < 1 ? 0.82 + 0.18 * easeBack(clamp(intro * 1.15)) : 1;
    const lkScale = iS * (1 + 0.014 * Math.sin(2 * th) + 0.012 * kick * E);
    const lkY = lkTop + Math.sin(3 * th) * 6 * E;
    const lkT = `translate(${cx - lkW / 2}px, ${lkY}px) perspective(1600px) rotateX(${-camY * 2.5 * E}deg) rotateY(${camX * 2.2 * E}deg) scale(${lkScale})`;
    if (lockup.style.width !== lkW + 'px') { lockup.style.width = glint.style.width = lkW + 'px'; }
    glint.style.height = lkH + 'px';
    lockup.style.transform = lkT;
    lockup.style.opacity = smooth(clamp(intro * 1.6));

    // glint: only touched while it's actually visible (it repaints when it moves)
    const gp = frac(t * CONFIG.glintsPerLoop + 0.5) / 0.07;
    const gOn = intro < 1 ? (intro > .45 && intro < .95) : gp < 1;
    if (gOn) {
      const gpos = intro < 1 ? 1.15 - clamp((intro - .45) / .5) * 1.3 : 1.15 - clamp(gp) * 1.3;
      glint.style.transform = lkT;
      glint.style.backgroundPosition = `${gpos * 100}% 0`;
      glint.style.opacity = intro < 1 ? 1 : Math.sin(Math.PI * gp);
      glint.hidden = false;
    } else if (!glint.hidden) glint.hidden = true;

    animateMotto(intro, th, br, kick, camX, lkTop);
    sealsEl.style.transform = `translate(0, ${lkTop + lkH + (L.portrait ? 50 : 30) + Math.sin(th * 3) * 12}px)`;
    sealsEl.style.opacity = smooth(clamp((intro - .55) / .45));
    sealGroups.forEach((sg, i) => sg.style.transform = `translateY(${Math.sin(4 * th + i * 1.6) * 6 * E}px)`);

    bt.style.transform = `translateX(${-t * BORDER_TILE_W}px)`;
    bb.style.transform = `translate(${-BORDER_TILE_W + t * BORDER_TILE_W}px, ${H - 70}px) scaleY(-1)`;

    if (dbg.style.display === 'block') dbg.textContent = `loop ${(t * CONFIG.loopSeconds).toFixed(1)}s · stage ${W}×${H} · quality ${LV} · ${Math.round(1000 / Math.max(1, dt))} fps`;
  }

  const imgs = [...document.images, lungsImg, skyImg];
  Promise.all(imgs.map(i => i.decode ? i.decode().catch(() => {}) : Promise.resolve())).then(() => { fit(true); markReady(); });
  setTimeout(markReady, 3000);
  requestAnimationFrame(frame);

  // ---------- touch-friendly controls ----------
  const hint = $('hint');
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const canFS = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const toggleFS = () => { try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (p && p.catch) p.catch(() => {}); }
  } catch (_) {} };
  const showHint = (text, ms = 4500) => { hint.textContent = text; hint.classList.add('show');
    clearTimeout(showHint.t); showHint.t = setTimeout(() => hint.classList.remove('show'), ms); };
  if (!standalone) setTimeout(() => showHint(canFS ? 'Tap anywhere for full screen'
    : 'Tip: Share → Add to Home Screen for full screen'), 2500);

  let lock = null; const keepAwake = async () => { try { if (!lock && 'wakeLock' in navigator) {
    lock = await navigator.wakeLock.request('screen'); lock.onrelease = () => lock = null; } } catch (_) {} };
  addEventListener('click', () => { keepAwake(); if (canFS) { hint.classList.remove('show'); toggleFS(); } });
  let idle; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle);
    idle = setTimeout(() => document.body.classList.add('idle'), 2000); };
  addEventListener('mousemove', wake); wake();
  addEventListener('keydown', e => { const k = e.key.toLowerCase();
    if (k === 'f') toggleFS();
    if (k === 'd') dbg.style.display = dbg.style.display === 'block' ? 'none' : 'block';
    if (k === 'r' && readyAt !== null) readyAt = performance.now();
    keepAwake(); });
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && keepAwake());
  keepAwake();
})();
</script>
</body>
</html>
